name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.13.0
          - 24.x
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and verify contracts
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run executable sample test
        run: npm run sample:test

      - name: Run disposable demo
        run: npm run demo

      - name: Verify documentation links
        run: npm run docs:links

      - name: Inspect workspace tarballs
        run: npm run package:check

      - name: Check prohibited runtime capabilities
        run: npm run capabilities:check

      - name: Audit production dependency graph
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: npm audit --omit=dev --audit-level=high

      - name: Verify generated files and whitespace
        run: git diff --exit-code --check
